[package]
name = "solitaire-collections"
version = "0.1.10"
description = "Desktop shell for Solitaire Collections"
authors = ["Solitaire Collections contributors"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
